# Temporary overlay: bind the law-fixed sfm_auth.py over the read-only image copy.
# Single auth-header authority (R5): Vault shared credential wins over any cfg pin.
services:
  somabrain_standalone_outbox_publisher:
    volumes:
      - ../../somabrain/memory/sfm_auth.py:/app/somabrain/memory/sfm_auth.py:ro
  somabrain_standalone_app:
    volumes:
      - ../../somabrain/memory/sfm_auth.py:/app/somabrain/memory/sfm_auth.py:ro
      - ../../somabrain/api/endpoints/memory.py:/app/somabrain/api/endpoints/memory.py:ro
      - ../../somabrain/api/endpoints/memory_alias.py:/app/somabrain/api/endpoints/memory_alias.py:ro

