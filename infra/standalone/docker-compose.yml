name: somabrain

services:
  somabrain_standalone_redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - somabrain_standalone_net
    ports:
      - "${REDIS_HOST_PORT:?set REDIS_HOST_PORT}:${REDIS_CONTAINER_PORT:?set REDIS_CONTAINER_PORT}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    # Production-like Redis configuration with persistence and memory management
    command:
      - redis-server
      - --maxmemory
      - "800mb"
      - --maxmemory-policy
      - "allkeys-lru"
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --tcp-keepalive
      - "300"
      - --timeout
      - "0"
      - --tcp-backlog
      - "511"
      - --databases
      - "16"
      - --loglevel
      - "notice"

  somabrain_standalone_kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    environment:
      # Production-like Kafka configuration for constrained environment
      KAFKA_CFG_NODE_ID: ${KAFKA_CFG_NODE_ID:?set KAFKA_CFG_NODE_ID}
      KAFKA_CFG_PROCESS_ROLES: ${KAFKA_CFG_PROCESS_ROLES:?set KAFKA_CFG_PROCESS_ROLES}
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS:?set KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}
      KAFKA_CFG_LISTENERS: ${KAFKA_CFG_LISTENERS:?set KAFKA_CFG_LISTENERS}
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://somabrain_standalone_kafka:9092,EXTERNAL://localhost:30102
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: ${KAFKA_CFG_CONTROLLER_LISTENER_NAMES:?set KAFKA_CFG_CONTROLLER_LISTENER_NAMES}
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: ${KAFKA_CFG_INTER_BROKER_LISTENER_NAME:?set KAFKA_CFG_INTER_BROKER_LISTENER_NAME}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP:?set KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}
      # Production settings
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 1
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Storage and retention (production-like)
      KAFKA_CFG_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_CFG_LOG_RETENTION_MS: "604800000"
      KAFKA_CFG_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_CFG_LOG_SEGMENT_BYTES: "67108864"
      KAFKA_CFG_LOG_CLEANUP_POLICY: "delete"
      KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
      # Performance tuning
      KAFKA_CFG_COMPRESSION_TYPE: "snappy"
      KAFKA_CFG_MESSAGE_MAX_BYTES: "1048576"
      KAFKA_CFG_REPLICA_FETCH_MAX_BYTES: "1048576"
      KAFKA_CFG_NUM_IO_THREADS: "4"
      KAFKA_CFG_NUM_NETWORK_THREADS: "3"
      KAFKA_CFG_NUM_REPLICA_FETCHERS: "1"
      KAFKA_CFG_SOCKET_SEND_BUFFER_BYTES: "102400"
      KAFKA_CFG_SOCKET_RECEIVE_BUFFER_BYTES: "102400"
      KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES: "104857600"
      # JVM settings for constrained memory
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent"
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID}
      KAFKA_BROKER_HOST_PORT: ${KAFKA_BROKER_HOST_PORT:?set KAFKA_BROKER_HOST_PORT}
      KAFKA_BROKER_CONTAINER_PORT: ${KAFKA_BROKER_CONTAINER_PORT:?set KAFKA_BROKER_CONTAINER_PORT}
    volumes:
      # Persist Kafka broker data in the correct data directory.
      # The apache/kafka image uses /var/lib/kafka/data for logs; mounting at that
      # exact path avoids Docker creating an anonymous volume that overrides persistence.
      - kafka_data:/var/lib/kafka/data
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /var/lib/kafka/data
        CONFIG_PATH=/tmp/kafka-server.properties
        cp /opt/kafka/config/kraft/server.properties "$${CONFIG_PATH}"
        {
          echo "process.roles=$${KAFKA_CFG_PROCESS_ROLES}"
          echo "node.id=$${KAFKA_CFG_NODE_ID}"
          # Some base configs may still read broker.id; set it explicitly for safety
          echo "broker.id=$${KAFKA_CFG_NODE_ID}"
          echo "controller.listener.names=$${KAFKA_CFG_CONTROLLER_LISTENER_NAMES}"
          echo "controller.quorum.voters=$${KAFKA_CFG_CONTROLLER_QUORUM_VOTERS}"
          echo "listeners=$${KAFKA_CFG_LISTENERS}"
          echo "advertised.listeners=$${KAFKA_CFG_ADVERTISED_LISTENERS}"
          echo "listener.security.protocol.map=$${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}"
          echo "inter.broker.listener.name=$${KAFKA_CFG_INTER_BROKER_LISTENER_NAME}"
          echo "log.dirs=$${KAFKA_CFG_LOG_DIRS}"
          echo "auto.create.topics.enable=$${KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE}"
          echo "num.partitions=$${KAFKA_CFG_NUM_PARTITIONS}"
          echo "default.replication.factor=$${KAFKA_CFG_DEFAULT_REPLICATION_FACTOR}"
          echo "offsets.topic.replication.factor=$${KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR}"
          echo "transaction.state.log.replication.factor=$${KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}"
          echo "transaction.state.log.min.isr=$${KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR}"
          echo "compression.type=$${KAFKA_CFG_COMPRESSION_TYPE}"
          echo "log.retention.ms=$${KAFKA_CFG_LOG_RETENTION_MS}"
          echo "log.segment.bytes=$${KAFKA_CFG_LOG_SEGMENT_BYTES}"
          echo "log.retention.bytes=$${KAFKA_CFG_LOG_RETENTION_BYTES}"
        } >> "$${CONFIG_PATH}"
        if [ ! -f /var/lib/kafka/data/meta.properties ]; then
          /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID} --config "$${CONFIG_PATH}"
        fi
        exec /opt/kafka/bin/kafka-server-start.sh "$${CONFIG_PATH}"
    ports:
      # Expose only the EXTERNAL listener container port to the host
      - "${KAFKA_BROKER_HOST_PORT:?set KAFKA_BROKER_HOST_PORT}:${KAFKA_BROKER_EXTERNAL_CONTAINER_PORT:?set KAFKA_BROKER_EXTERNAL_CONTAINER_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/::1/9092' 2>/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10
    networks:
      - somabrain_standalone_net

  # --- Kafka topic bootstrap ----------------------------------------------
  somabrain_standalone_kafka_topics_init:
    image: apache/kafka:3.7.0
    restart: "no"
    depends_on:
      somabrain_standalone_kafka:
        condition: service_healthy
    networks:
      - somabrain_standalone_net
    environment:
      KAFKA_BROKER_CONTAINER_PORT: ${KAFKA_BROKER_CONTAINER_PORT:?set KAFKA_BROKER_CONTAINER_PORT}
    command:
      - bash
      - -c
      - |
        set -e
        BOOTSTRAP="somabrain_standalone_kafka:$${KAFKA_BROKER_CONTAINER_PORT}"
        TOPICS=(
          cog.global.frame
          cog.next_event
          cog.action.updates
          cog.state.updates
          cog.agent.updates
          cog.config.updates
          cog.segments
        )
        for t in "$${TOPICS[@]}"; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "$${BOOTSTRAP}" \
            --create --if-not-exists \
            --topic "$${t}" \
            --partitions 3 \
            --replication-factor 1
        done
        echo "Kafka topics initialized."

  somabrain_standalone_kafka_exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    restart: unless-stopped
    command:
      - --kafka.server=somabrain_standalone_kafka:${KAFKA_BROKER_CONTAINER_PORT:?set KAFKA_BROKER_CONTAINER_PORT}
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    depends_on:
      somabrain_standalone_kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_EXPORTER_HOST_PORT:?set KAFKA_EXPORTER_HOST_PORT}:${KAFKA_EXPORTER_CONTAINER_PORT:?set KAFKA_EXPORTER_CONTAINER_PORT}"
    networks:
      - somabrain_standalone_net
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://localhost:9308/" ]
      interval: 30s
      timeout: 5s
      retries: 3

  somabrain_standalone_schema_registry:
    image: confluentinc/cp-schema-registry:7.6.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://somabrain_standalone_kafka:${KAFKA_BROKER_CONTAINER_PORT:?set KAFKA_BROKER_CONTAINER_PORT}"
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx192m"
    depends_on:
      somabrain_standalone_kafka:
        condition: service_healthy
    networks:
      - somabrain_standalone_net
    ports:
      - "${SCHEMA_REGISTRY_HOST_PORT:?set SCHEMA_REGISTRY_HOST_PORT}:8081"
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://localhost:8081/subjects" ]
      interval: 30s
      timeout: 5s
      retries: 3

  somabrain_standalone_opa:
    image: openpolicyagent/opa:0.54.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    # Production-like OPA configuration with decision logging and metrics
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --diagnostic-addr=0.0.0.0:8282
      - --log-level=error
      - --log-format=json
      - --set=decision_logs.console=true
      - --set=status.console=true
      - --set=default_decision=somabrain/auth/allow
      - /policies
    networks:
      - somabrain_standalone_net
    ports:
      - "${OPA_HOST_PORT:?set OPA_HOST_PORT}:${OPA_CONTAINER_PORT:?set OPA_CONTAINER_PORT}"
    volumes:
      - ./ops/opa/policies:/policies:ro
      - opa_data:/var/lib/opa
    healthcheck:
      # OPA's minimal image lacks curl/wget. Use OPA's built-in check command
      # which verifies the server is running and policies are loaded.
      test: [ "CMD", "/opa", "check", "/policies" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  somabrain_standalone_prometheus:
    image: prom/prometheus:v2.49.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - somabrain_standalone_net
    ports:
      - "${PROMETHEUS_HOST_PORT:?set PROMETHEUS_HOST_PORT}:${PROMETHEUS_CONTAINER_PORT:?set PROMETHEUS_CONTAINER_PORT}"
    volumes:
      - ../../infra/ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Production-like Prometheus configuration
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --storage.tsdb.min-block-duration=2h
      - --storage.tsdb.max-block-duration=2h
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      - --web.enable-admin-api
      - --log.level=warn
      - --log.format=json
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 5s
      retries: 3

  somabrain_standalone_jaeger:
    image: jaegertracing/all-in-one:1.53
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - somabrain_standalone_net
    ports:
      - "${JAEGER_HOST_PORT:?set JAEGER_HOST_PORT}:16686"
      - "30112:14250"
      - "30113:14268"
      - "30114:4317"
      - "30117:4318"
    environment:
      # Production-like Jaeger configuration (memory storage for constrained local dev)
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: "memory"
      MEMORY_MAX_TRACES: "10000"
      LOG_LEVEL: "warn"
      QUERY_MAX_CLOCK_SKEW_ADJUSTMENT: "0s"
      METRICS_BACKEND: "prometheus"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://localhost:16686/" ]
      interval: 30s
      timeout: 5s
      retries: 3

  somabrain_standalone_postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      # Password arrives as a mounted file (t=0 material), never as ENV.
      POSTGRES_PASSWORD_FILE: /run/secrets_t0/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # Production-like PostgreSQL tuning for constrained environment
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_HOST_PORT:?set POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT:?set POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    networks:
      - somabrain_standalone_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER} -d ${POSTGRES_DB:?set POSTGRES_DB}" ]
      interval: 30s
      timeout: 5s
      retries: 3
    # Production-like PostgreSQL configuration
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=100
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=4MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - min_wal_size=80MB
      - -c
      - max_wal_size=1GB
      - -c
      - log_statement=none
      - -c
      - log_duration=off
      - -c
      - log_min_duration_statement=1000
      - -c
      - autovacuum=on
      - -c
      - autovacuum_max_workers=2

  # --- Vault secrets (30xxx range infrastructure) ----------------------------
  # --- Vault: server mode, file storage, real seal --------------------------
  # NOT dev mode. Dev mode keeps secrets in RAM and discards every credential
  # on restart — a lottery, not a deployment. File storage on a named volume
  # makes the store survive restart; the stack starts SEALED and
  # vault_unseal.py (below) initialises it once and unseals it on every boot.
  #
  # The root token is generated by sys/init and persisted into the t=0
  # secrets dir (vault_root_token) — never a value in ENV (Rule 164).
  somabrain_standalone_vault:
    image: hashicorp/vault:1.13.3
    container_name: somabrain_standalone_vault
    restart: unless-stopped
    # Invoke `vault` directly. The image's docker-entrypoint.sh rewrites any
    # `server` command into dev-mode flags and loads a config twice if one is
    # also named — two tcp listeners on 8200 and "address already in use".
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - somabrain_standalone_vault_data:/vault/data
    ports:
      # Brain-range Vault port: 30200
      - "30200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      # Healthy means "the API answers", NOT "unsealed". `vault status` exits 2
      # when sealed and 1 when unreachable. Gating on "unsealed" would deadlock:
      # nothing could ever start the unseal.
      test: [ "CMD-SHELL", "vault status >/dev/null 2>&1; [ $$? -ne 1 ]" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - somabrain_standalone_net

  # --- Vault lifecycle: init once, unseal on every boot ---------------------
  somabrain_standalone_vault_unseal:
    image: python:3.11-alpine
    container_name: somabrain_standalone_vault_unseal
    working_dir: /work
    volumes:
      - ./vault_unseal.py:/work/vault_unseal.py:ro
      # Read-WRITE: first boot writes the generated root token and unseal key
      # into the t=0 secrets dir. Those two files are the only copy.
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/work/secrets
    environment:
      VAULT_ADDR: "${SOMABRAIN_VAULT_ADDR:?set SOMABRAIN_VAULT_ADDR}"
      SECRETS_DIR: /work/secrets
    entrypoint: [ "python3", "/work/vault_unseal.py" ]
    networks:
      - somabrain_standalone_net
    depends_on:
      somabrain_standalone_vault:
        condition: service_healthy
    restart: "no"

  somabrain_standalone_vault_init:
    image: alpine:latest
    container_name: somabrain_standalone_vault_init
    depends_on:
      somabrain_standalone_vault_unseal:
        condition: service_completed_successfully
    environment:
      # Bootstrap topology only. Every credential is a FILE path into the
      # mounted t=0 secrets dir — never a value in ENV (Rule 164). The Vault
      # bootstrap token is the same: a path, not a token.
      SOMABRAIN_VAULT_TOKEN_FILE: "${SOMABRAIN_VAULT_TOKEN_FILE:?set SOMABRAIN_VAULT_TOKEN_FILE}"
      SOMABRAIN_VAULT_ADDR: "${SOMABRAIN_VAULT_ADDR:?set SOMABRAIN_VAULT_ADDR}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_HOST: "${POSTGRES_HOST:?set POSTGRES_HOST}"
      POSTGRES_PORT: "${POSTGRES_PORT:?set POSTGRES_PORT}"
      SOMABRAIN_REDIS_URL: "${SOMABRAIN_REDIS_URL:?set SOMABRAIN_REDIS_URL}"
      # Secret material, each a PATH into /run/secrets_t0 (SOMA_T0_SECRETS_DIR).
      # Generate once in the agent stack (infra/standalone/secrets/). This job
      # never invents a substitute and never sees the values in ENV.
      POSTGRES_PASSWORD_FILE: "${POSTGRES_PASSWORD_FILE:?set POSTGRES_PASSWORD_FILE}"
      SOMABRAIN_JWT_SECRET_FILE: "${SOMABRAIN_JWT_SECRET_FILE:?set SOMABRAIN_JWT_SECRET_FILE}"
      SUPERVISOR_HTTP_PASS_FILE: "${SUPERVISOR_HTTP_PASS_FILE:?set SUPERVISOR_HTTP_PASS_FILE}"
      SOMABRAIN_API_TOKEN_FILE: "${SOMABRAIN_API_TOKEN_FILE:?set SOMABRAIN_API_TOKEN_FILE}"
      # A PATH, not a secret — the same contract as VAULT_TOKEN_FILE. It points
      # at the shared t=0 material the agent stack holds once (somaAgent01
      # infra/standalone/secrets/, one file per secret). The VALUE never travels
      # through ENV: two stacks each generating their own copy is exactly the
      # 401 this exists to prevent. Required — no default path to fall back to.
      SOMABRAIN_MEMORY_HTTP_TOKEN_FILE: "${SOMABRAIN_MEMORY_HTTP_TOKEN_FILE:?set SOMABRAIN_MEMORY_HTTP_TOKEN_FILE}"
    volumes:
      # Shared t=0 credential material, read-only. This job never writes here.
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    networks:
      - somabrain_standalone_net
    entrypoint: [ "sh", "-c" ]
    command:
      - |
        set -eu
        apk add --no-cache curl jq

        # ---- Read every credential from t=0 files, never from ENV -------
        # A missing or empty file is a refusal: this job will NOT invent a
        # substitute (Rule 91 / Rule 164).
        read_secret() {
          f="$${1:?read_secret needs a path}"
          if [ ! -s "$${f}" ]; then
            echo "FATAL: secret file missing or empty: $${f}" >&2
            exit 1
          fi
          tr -d '\r\n' < "$${f}"
        }
        # Optional: a credential that may already live in Vault from an earlier
        # provision. Absence is not a failure and is NOT a licence to invent a
        # value — the key is simply left as it is.
        read_optional_secret() {
          f="$${1:?read_optional_secret needs a path}"
          if [ ! -s "$${f}" ]; then
            echo "  (no t=0 file for $${f}; leaving any existing Vault value untouched)"
            return 0
          fi
          tr -d '\r\n' < "$${f}"
        }

        VAULT_TOKEN="$$(read_secret "$${SOMABRAIN_VAULT_TOKEN_FILE}")"
        POSTGRES_PASSWORD="$$(read_secret "$${POSTGRES_PASSWORD_FILE}")"
        SOMABRAIN_JWT_SECRET="$$(read_secret "$${SOMABRAIN_JWT_SECRET_FILE}")"
        SUPERVISOR_HTTP_PASS="$$(read_secret "$${SUPERVISOR_HTTP_PASS_FILE}")"
        SOMABRAIN_API_TOKEN="$$(read_optional_secret "$${SOMABRAIN_API_TOKEN_FILE}")"

        # ---- Shared agent↔brain credential ------------------------------
        # One trust boundary, one value, one reader path. somabrain's
        # vault_client.get_runtime_secret("memory_http_token") reads
        # secret/agent/credentials[somabrain_memory_http_token] — see
        # SHARED_CREDENTIALS_PATH and MEMORY_HTTP_TOKEN_KEY. Writing it to
        # somabrain/runtime put it where the reader never looked, and
        # generating it per stack gave the two sides different values.
        TOKEN_FILE="$${SOMABRAIN_MEMORY_HTTP_TOKEN_FILE}"
        if [ ! -s "$${TOKEN_FILE}" ]; then
          echo "FATAL: shared memory token file missing or empty: $${TOKEN_FILE}" >&2
          echo "       Generate it once in the agent stack (infra/standalone/secrets/," >&2
          echo "       see its README.md) and point SOMA_T0_SECRETS_DIR at that" >&2
          echo "       directory. This job will NOT invent a substitute." >&2
          exit 1
        fi
        # Same trimming init_vault.py applies: every consumer of these values
        # strips trailing newlines, so store what they will actually see.
        SHARED_MEMORY_TOKEN="$$(tr -d '\r\n' < "$${TOKEN_FILE}")"
        if [ -z "$${SHARED_MEMORY_TOKEN}" ]; then
          echo "FATAL: shared memory token file is blank after trimming" >&2
          exit 1
        fi

        # Wait for vault
        until curl -s "$${SOMABRAIN_VAULT_ADDR}/v1/sys/health"; do sleep 1; done

        # Mount KV v2 — `somabrain` for this service's own secrets, `secret`
        # for the shared agent/credentials document the reader expects.
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST -d '{"type":"kv-v2"}' "$${SOMABRAIN_VAULT_ADDR}/v1/sys/mounts/somabrain"
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST -d '{"type":"kv-v2"}' "$${SOMABRAIN_VAULT_ADDR}/v1/sys/mounts/secret"

        # 1. Database Credentials
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST \
          -d "{\"data\": {\"username\": \"$${POSTGRES_USER}\", \"password\": \"$${POSTGRES_PASSWORD}\", \"host\": \"$${POSTGRES_HOST}\", \"port\": $${POSTGRES_PORT}, \"dbname\": \"$${POSTGRES_DB}\"}}" \
          "$${SOMABRAIN_VAULT_ADDR}/v1/somabrain/data/database"

        # 2. Redis Credentials
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST \
          -d "{\"data\": {\"url\": \"$${SOMABRAIN_REDIS_URL}\"}}" \
          "$${SOMABRAIN_VAULT_ADDR}/v1/somabrain/data/redis"

        # 3. JWT Secret
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST \
          -d "{\"data\": {\"jwt_secret\": \"$${SOMABRAIN_JWT_SECRET}\"}}" \
          "$${SOMABRAIN_VAULT_ADDR}/v1/somabrain/data/auth"

        # 4. Runtime service secrets — this service's OWN keys only. The shared
        #    memory token deliberately does NOT live here.
        curl -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST \
          -d "{\"data\": {\"supervisor_http_pass\": \"$${SUPERVISOR_HTTP_PASS}\", \"api_token\": \"$${SOMABRAIN_API_TOKEN}\"}}" \
          "$${SOMABRAIN_VAULT_ADDR}/v1/somabrain/data/runtime"

        # 5. SHARED agent↔brain trust boundary. Exactly the document and key
        #    vault_client reads. The value came from t=0 material — not from
        #    ENV, and not invented by this job.
        #
        #    MERGE, never replace. Vault KV v2 POST replaces the entire `data`
        #    object at a path — writing one key alone deletes every sibling
        #    credential in that document. Read it first, merge in memory, write
        #    the whole object back, then read back and assert the key landed.
        SHARED_PATH="$${SOMABRAIN_VAULT_ADDR}/v1/secret/data/agent/credentials"
        # Snapshot the key set BEFORE the merge so we can assert every sibling
        # survived. KV v2 POST replaces the whole document; a one-key write
        # deletes every other key. This has already caused real data loss.
        PRE_KEYS="$(curl -s -H "X-Vault-Token: $${VAULT_TOKEN}" "$${SHARED_PATH}" \
          | jq -r '((.data.data) // {}) | keys[]' | sort | tr '\n' ' ')"
        EXISTING="$(curl -s -H "X-Vault-Token: $${VAULT_TOKEN}" "$${SHARED_PATH}" \
          | jq -c --arg tok "$${SHARED_MEMORY_TOKEN}" \
            '((.data.data) // {}) + {somabrain_memory_http_token: $$tok}')"
        if [ -z "$${EXISTING}" ] || [ "$${EXISTING}" = "null" ]; then
          echo "FATAL: could not read agent/credentials before merging." >&2
          echo "       Refusing to write blind - a blind write deletes every" >&2
          echo "       other key in that document." >&2
          exit 1
        fi
        curl -sf -H "X-Vault-Token: $${VAULT_TOKEN}" -X POST \
          -d "{\"data\": $${EXISTING}}" "$${SHARED_PATH}" >/dev/null

        # Read back the WHOLE document and assert:
        #   1. the shared token landed and matches byte-for-byte
        #   2. every pre-existing key is still present
        POST_JSON="$(curl -s -H "X-Vault-Token: $${VAULT_TOKEN}" "$${SHARED_PATH}")"
        STORED="$(printf '%s' "$${POST_JSON}" | jq -r '.data.data.somabrain_memory_http_token // empty')"
        if [ "$${STORED}" != "$${SHARED_MEMORY_TOKEN}" ]; then
          echo "FATAL: shared memory token read-back mismatch after merge write" >&2
          exit 1
        fi
        POST_KEYS="$(printf '%s' "$${POST_JSON}" | jq -r '((.data.data) // {}) | keys[]' | sort | tr '\n' ' ')"
        for k in $${PRE_KEYS}; do
          case " $${POST_KEYS} " in
            *" $$k "*) ;;
            *)
              echo "FATAL: merge write destroyed sibling key '$${k}' in agent/credentials." >&2
              echo "       KV v2 POST replaces the whole document. The read-modify-" >&2
              echo "       write must carry every pre-existing key forward." >&2
              exit 1
              ;;
          esac
        done
        KEPT="$(printf '%s' "$${POST_JSON}" | jq -r '((.data.data) // {}) | keys | length')"
        echo "  shared credential merged in; document now holds $${KEPT} key(s): $${POST_KEYS}"

        echo "Vault initialized and secrets populated."

  somabrain_standalone_db_migrate:
    image: somabrain:latest
    depends_on:
      somabrain_standalone_vault_init:
        condition: service_completed_successfully
      somabrain_standalone_postgres:
        condition: service_healthy
    networks:
      - somabrain_standalone_net
    volumes:
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    environment:
      # VAULT BOOTSTRAP ONLY — address + token FILE, never the token value.
      VAULT_ADDR: "${SOMABRAIN_VAULT_ADDR:?set SOMABRAIN_VAULT_ADDR}"
      VAULT_TOKEN_FILE: "${SOMABRAIN_VAULT_TOKEN_FILE:?set SOMABRAIN_VAULT_TOKEN_FILE}"
      DJANGO_SETTINGS_MODULE: "somabrain.settings.standalone"
      # Shared seam dim: agent MEM_EMBED_DIM == SFM SOMA_VECTOR_DIM == this
      EMBED_DIM: "${EMBED_DIM:?set EMBED_DIM}"
      RUNNING_IN_DOCKER: "true"
    # Dev convenience: run Django migrations.
    command: [ "sh", "-lc", "cd /app && python manage.py migrate --noinput" ]
    restart: "no"
    profiles: [ "dev" ]

  somabrain_standalone_postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
      POSTGRES_HOST: "somabrain_standalone_postgres"
      POSTGRES_PORT: "${POSTGRES_CONTAINER_PORT:?set POSTGRES_CONTAINER_PORT}"
      # Password is read from the t=0 file at start; DATA_SOURCE_NAME is
      # assembled in-process and never appears in this file or in .env.
      POSTGRES_PASSWORD_FILE: /run/secrets_t0/postgres_password
    volumes:
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -eu
        f="$${POSTGRES_PASSWORD_FILE:?POSTGRES_PASSWORD_FILE is required}"
        if [ ! -s "$${f}" ]; then
          echo "FATAL: secret file missing or empty: $${f}" >&2
          exit 1
        fi
        PW="$$(tr -d '\r\n' < "$${f}")"
        export DATA_SOURCE_NAME="postgresql://$${POSTGRES_USER}:$${PW}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/$${POSTGRES_DB}?sslmode=disable"
        exec /bin/postgres_exporter
    depends_on:
      somabrain_standalone_postgres:
        condition: service_healthy
    ports:
      - "${POSTGRES_EXPORTER_HOST_PORT:?set POSTGRES_EXPORTER_HOST_PORT}:${POSTGRES_EXPORTER_CONTAINER_PORT:?set POSTGRES_EXPORTER_CONTAINER_PORT}"
    networks:
      - somabrain_standalone_net
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://localhost:9187/" ]
      interval: 30s
      timeout: 5s
      retries: 3

  somabrain_standalone_app:
    build:
      context: ../..
      dockerfile: infra/standalone/Dockerfile
    image: somabrain:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    depends_on:
      somabrain_standalone_vault_init:
        condition: service_completed_successfully
      somabrain_standalone_redis:
        condition: service_healthy
      somabrain_standalone_kafka:
        condition: service_healthy
      somabrain_standalone_opa:
        condition: service_healthy
      somabrain_standalone_postgres:
        condition: service_healthy
    #      somabrain_standalone_milvus:
    #        condition: service_healthy
    networks:
      somabrain_standalone_net:
        # RFC 1035 aliases. The compose container name contains underscores
        # and Django host_validation_re rejects it as HTTP_HOST. Peers use
        # http://somabrain:30101.
        aliases:
          - somabrain
          - somabrain-app
    # Ensure containers can reach host services (e.g., external memory on 10101)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../somabrain:/app/somabrain:ro
      - ../../scripts:/app/scripts:ro
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    tmpfs:
      - /app/logs:rw,size=64m,mode=1777
      - /tmp:rw,size=64m,mode=1777
    environment:
      # Django settings MUST be set for standalone scripts like initialize_runtime.py
      DJANGO_SETTINGS_MODULE: "somabrain.settings.standalone"
      RUNNING_IN_DOCKER: "true"
      # Host headers seen by the app container (healthchecks, host-bound curl, Docker Desktop proxy)
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?set ALLOWED_HOSTS}"
      # Gunicorn writes its control socket to $HOME; tmpfs /tmp keeps it writable.
      HOME: "/tmp"

      # VAULT BOOTSTRAP ONLY
      VAULT_ADDR: "${SOMABRAIN_VAULT_ADDR:?set SOMABRAIN_VAULT_ADDR}"
      VAULT_TOKEN_FILE: "${SOMABRAIN_VAULT_TOKEN_FILE:?set SOMABRAIN_VAULT_TOKEN_FILE}"

      # Secrets are NOT environment variables (Rule 164). JWT secret, API token
      # and the shared agent memory token are read from Vault via
      # VAULT_TOKEN_FILE + somabrain/core/security/vault_client.py. There is
      # deliberately no SOMABRAIN_MEMORY_HTTP_TOKEN here.
      # Use the internal Postgres service name; the host-bound port is not reachable from the container.

      # Configuration Pass-throughs (No hardcoded URLs)
      SOMABRAIN_HOST: "${SOMABRAIN_HOST:?set SOMABRAIN_HOST}"
      SOMABRAIN_PORT: "${SOMABRAIN_PORT:?set SOMABRAIN_PORT}"
      SOMABRAIN_WORKERS: "${SOMABRAIN_WORKERS:?set SOMABRAIN_WORKERS}"
      SOMABRAIN_OPA_URL: "${SOMABRAIN_OPA_URL:?set SOMABRAIN_OPA_URL}"
      SOMABRAIN_KAFKA_URL: "kafka://somabrain_standalone_kafka:9092"
      # Default memory endpoint:
      #   - Standalone on macOS/Windows Docker Desktop: http://host.docker.internal:10101
      #   - Shared network / Linux: override to http://somafractalmemory-standalone-api:10101
      SOMABRAIN_MEMORY_HTTP_ENDPOINT: "${SOMABRAIN_MEMORY_HTTP_ENDPOINT:?set SOMABRAIN_MEMORY_HTTP_ENDPOINT}"

      # Feature Flags
      SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS: "${SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS:?set SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS}"
      SOMABRAIN_FORCE_FULL_STACK: "${SOMABRAIN_FORCE_FULL_STACK:?set SOMABRAIN_FORCE_FULL_STACK}"
      SOMABRAIN_REQUIRE_MEMORY: "${SOMABRAIN_REQUIRE_MEMORY:?set SOMABRAIN_REQUIRE_MEMORY}"
      SOMABRAIN_PREDICTOR_PROVIDER: "${SOMABRAIN_PREDICTOR_PROVIDER:?set SOMABRAIN_PREDICTOR_PROVIDER}"
      SOMABRAIN_MEMORY_FAST_ACK: "${SOMABRAIN_MEMORY_FAST_ACK:?set SOMABRAIN_MEMORY_FAST_ACK}"
      # Memory weighting is controlled by runtime config overrides (local only)
      SOMABRAIN_DEFAULT_TENANT: "${SOMABRAIN_DEFAULT_TENANT:?set SOMABRAIN_DEFAULT_TENANT}"
      # Tenant partition name. Required, no default (Rule 91). Must match the
      # namespace the agent sends with memory writes.
      SOMABRAIN_NAMESPACE: "${SOMABRAIN_NAMESPACE:?set SOMABRAIN_NAMESPACE}"
      SOMA_DEPLOY_MODE: "${SOMA_DEPLOY_MODE:?set SOMA_DEPLOY_MODE}"
      SOMABRAIN_MODE: "${SOMABRAIN_MODE:?set SOMABRAIN_MODE}"
      SOMABRAIN_ANN_BACKEND: "${SOMABRAIN_ANN_BACKEND:?set SOMABRAIN_ANN_BACKEND}"
      SUPERVISOR_HTTP_USER: "${SUPERVISOR_HTTP_USER:?set SUPERVISOR_HTTP_USER}"
      # Adaptive knobs are controlled by runtime config overrides (local only)
      SOMABRAIN_LEARNING_TENANTS_FILE: "${SOMABRAIN_LEARNING_TENANTS_FILE:?set SOMABRAIN_LEARNING_TENANTS_FILE}"
      # Disable Kafka readiness check for local dev (tests/smoke/kafka_smoke_test.py not included)
    ports:
      - "${SOMABRAIN_HOST_PORT:?set SOMABRAIN_HOST_PORT}:${SOMABRAIN_PORT:?set SOMABRAIN_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${SOMABRAIN_PORT:?set SOMABRAIN_PORT}/health || exit 1" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    # No local journal volume; fail-fast only
    # Security hardening: drop all capabilities, run with read-only rootfs, and disallow privilege escalation.
    # Note: we mount a tmpfs for /app/logs to keep runtime logs writable.
    cap_drop: [ "ALL" ]
    read_only: true
    security_opt:
      - no-new-privileges:true

  somabrain_standalone_cog:
    build:
      context: ../..
      dockerfile: infra/standalone/Dockerfile
    image: somabrain:latest
    restart: unless-stopped
    depends_on:
      somabrain_standalone_vault_init:
        condition: service_completed_successfully
      somabrain_standalone_postgres:
        condition: service_healthy
      somabrain_standalone_redis:
        condition: service_healthy
      somabrain_standalone_kafka:
        condition: service_healthy
      somabrain_standalone_kafka_topics_init:
        condition: service_completed_successfully
      somabrain_standalone_opa:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Production-like allocation for cognitive services
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - somabrain_standalone_net
    volumes:
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    environment:
      DJANGO_SETTINGS_MODULE: "somabrain.settings.standalone"
      RUNNING_IN_DOCKER: "true"

      # VAULT BOOTSTRAP ONLY — address + token FILE, never the token value.
      VAULT_ADDR: "${SOMABRAIN_VAULT_ADDR:?set SOMABRAIN_VAULT_ADDR}"
      VAULT_TOKEN_FILE: "${SOMABRAIN_VAULT_TOKEN_FILE:?set SOMABRAIN_VAULT_TOKEN_FILE}"

      # Secrets are NOT environment variables (Rule 164). JWT secret, API token
      # and the shared agent memory token are read from Vault via
      # VAULT_TOKEN_FILE + somabrain/core/security/vault_client.py. There is
      # deliberately no SOMABRAIN_MEMORY_HTTP_TOKEN here.
      # Use the internal Postgres service name; the host-bound port is not reachable from the container.
      SOMABRAIN_MEMORY_HTTP_ENDPOINT: "${SOMABRAIN_MEMORY_HTTP_ENDPOINT:?set SOMABRAIN_MEMORY_HTTP_ENDPOINT}"

      # Configuration Pass-throughs
      SOMABRAIN_STRICT_REAL: "1"
      SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS: "${SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS:?set SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS}"
      SOMABRAIN_REQUIRE_MEMORY: "${SOMABRAIN_REQUIRE_MEMORY:?set SOMABRAIN_REQUIRE_MEMORY}"
      SOMABRAIN_MODE: "${SOMABRAIN_MODE:?set SOMABRAIN_MODE}"
      SOMA_HEAT_METHOD: "lanczos"
      # Enable OTEL tracing to Jaeger collector
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:?set OTEL_EXPORTER_OTLP_ENDPOINT}"
      OTEL_SERVICE_NAME: "somabrain-cog"
      SOMABRAIN_DEFAULT_TENANT: "${SOMABRAIN_DEFAULT_TENANT:?set SOMABRAIN_DEFAULT_TENANT}"
      # Tenant partition name. Required, no default (Rule 91). Must match the
      # namespace the agent sends with memory writes.
      SOMABRAIN_NAMESPACE: "${SOMABRAIN_NAMESPACE:?set SOMABRAIN_NAMESPACE}"
      # Supervisor HTTP auth used by API for control; only on internal network
      SUPERVISOR_HTTP_USER: "${SUPERVISOR_HTTP_USER:?set SUPERVISOR_HTTP_USER}"
      # Keep cognition in sync for observability (no functional dependency)
      # Adaptive knobs are controlled by runtime config overrides (local only)
      SOMABRAIN_LEARNING_TENANTS_FILE: "${SOMABRAIN_LEARNING_TENANTS_FILE:?set SOMABRAIN_LEARNING_TENANTS_FILE}"
      # Program-specific ports (supervisor will pass to processes)
      REWARD_PRODUCER_PORT: "${REWARD_PRODUCER_PORT:?set REWARD_PRODUCER_PORT}"
      SOMABRAIN_TOPIC_STATE_UPDATES: "${SOMABRAIN_TOPIC_STATE_UPDATES:?set SOMABRAIN_TOPIC_STATE_UPDATES}"
      SOMABRAIN_TOPIC_AGENT_UPDATES: "${SOMABRAIN_TOPIC_AGENT_UPDATES:?set SOMABRAIN_TOPIC_AGENT_UPDATES}"
      SOMABRAIN_TOPIC_ACTION_UPDATES: "${SOMABRAIN_TOPIC_ACTION_UPDATES:?set SOMABRAIN_TOPIC_ACTION_UPDATES}"
      SOMABRAIN_TOPIC_GLOBAL_FRAME: "${SOMABRAIN_TOPIC_GLOBAL_FRAME:?set SOMABRAIN_TOPIC_GLOBAL_FRAME}"
      SOMABRAIN_TOPIC_NEXT_EVENT: "${SOMABRAIN_TOPIC_NEXT_EVENT:?set SOMABRAIN_TOPIC_NEXT_EVENT}"
      SOMABRAIN_TOPIC_SEGMENTS: "${SOMABRAIN_TOPIC_SEGMENTS:?set SOMABRAIN_TOPIC_SEGMENTS}"
      SOMABRAIN_TOPIC_CONFIG_UPDATES: "${SOMABRAIN_TOPIC_CONFIG_UPDATES:?set SOMABRAIN_TOPIC_CONFIG_UPDATES}"
      # Milvus removed: brain uses SFM's Milvus instead
    ports:
      # Reward producer HTTP (host default 30083)
      - "${COG_REWARD_PRODUCER_HOST_PORT:?set COG_REWARD_PRODUCER_HOST_PORT}:8083"
      # Integrator health/metrics (program-level env set below via supervisor env)
      - "${COG_INTEGRATOR_HEALTH_HOST_PORT:?set COG_INTEGRATOR_HEALTH_HOST_PORT}:9010"
      # Segmentation health
      - "${SEGMENTATION_HEALTH_HOST_PORT:?set SEGMENTATION_HEALTH_HOST_PORT}:9016"
    command:
      - sh
      - -lc
      - >-
        export SUPERVISOR_HTTP_PASS="$$(python -c "from somabrain.core.security.vault_client import get_runtime_secret; print(get_runtime_secret('supervisor_http_pass'))")"
        && exec /usr/bin/supervisord -c /app/ops/supervisor/supervisord.conf -l /dev/stdout
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PASS="$$(python -c "from somabrain.core.security.vault_client import get_runtime_secret; print(get_runtime_secret('supervisor_http_pass'))")" &&
          curl -fsS "http://$${SUPERVISOR_HTTP_USER:?set SUPERVISOR_HTTP_USER}:$${PASS}@localhost:9001" >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
    cap_drop: [ "ALL" ]
    # read_only disabled to allow supervisor tmp/log paths in minimal dev
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /app/logs:rw,size=64m,mode=1777
      - /tmp:rw,size=64m,mode=1777

  somabrain_standalone_outbox_publisher:
    build:
      context: ../..
      dockerfile: infra/standalone/Dockerfile
    image: somabrain:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      somabrain_standalone_vault_init:
        condition: service_completed_successfully
      somabrain_standalone_kafka:
        condition: service_healthy
      somabrain_standalone_postgres:
        condition: service_healthy
    networks:
      - somabrain_standalone_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [ "python", "-m", "somabrain.workers.outbox_publisher" ]
    environment:
      # Django settings MUST be first - required for all Django workers
      DJANGO_SETTINGS_MODULE: "somabrain.settings.standalone"
      RUNNING_IN_DOCKER: "true"

      # VAULT BOOTSTRAP ONLY
      VAULT_ADDR: "${SOMABRAIN_VAULT_ADDR:?set SOMABRAIN_VAULT_ADDR}"
      VAULT_TOKEN_FILE: "${SOMABRAIN_VAULT_TOKEN_FILE:?set SOMABRAIN_VAULT_TOKEN_FILE}"

      # Resolved secrets required before Django settings import.
      # Use the internal Postgres service name; the host-bound port is not reachable from the container.
      SOMABRAIN_MEMORY_HTTP_ENDPOINT: "${SOMABRAIN_MEMORY_HTTP_ENDPOINT:?set SOMABRAIN_MEMORY_HTTP_ENDPOINT}"

      SOMABRAIN_PREDICTOR_PROVIDER: "${SOMABRAIN_PREDICTOR_PROVIDER:?set SOMABRAIN_PREDICTOR_PROVIDER}"
      SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS: "${SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS:?set SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS}"
      SOMABRAIN_FORCE_FULL_STACK: "${SOMABRAIN_FORCE_FULL_STACK:?set SOMABRAIN_FORCE_FULL_STACK}"
      SOMABRAIN_OUTBOX_BATCH_SIZE: ${SOMABRAIN_OUTBOX_BATCH_SIZE:?set SOMABRAIN_OUTBOX_BATCH_SIZE}
      SOMABRAIN_OUTBOX_MAX_DELAY: ${SOMABRAIN_OUTBOX_MAX_DELAY:?set SOMABRAIN_OUTBOX_MAX_DELAY}
      # Propagate the global memory cap to the outbox publisher.
      SOMABRAIN_MEMORY_MAX: "${SOMABRAIN_MEMORY_MAX:?set SOMABRAIN_MEMORY_MAX}"
      SOMABRAIN_KAFKA_URL: "${SOMABRAIN_KAFKA_URL:?set SOMABRAIN_KAFKA_URL}"
    # No journal mount required
    cap_drop: [ "ALL" ]
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    tmpfs:
      - /app/logs:rw,size=64m,mode=1777
      - /tmp:rw,size=64m,mode=1777
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 30s
      timeout: 5s
      retries: 1

  # --- MinIO object storage (used by SFM, not brain-local Milvus) -----------
  somabrain_standalone_minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    hostname: minio
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      # MinIO accepts the *_FILE form, so the credential is read from t=0
      # material and never appears in the container environment. ENV carries a
      # PATH, exactly like VAULT_TOKEN_FILE.
      MINIO_ROOT_USER_FILE: ${MINIO_ROOT_USER_FILE:?set MINIO_ROOT_USER_FILE}
      MINIO_ROOT_PASSWORD_FILE: ${MINIO_ROOT_PASSWORD_FILE:?set MINIO_ROOT_PASSWORD_FILE}
    volumes:
      - minio_data:/minio_data
    ports:
      - "30109:9000"
      - "30110:9001"
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      somabrain_standalone_net:
        aliases:
          - minio

  # --- Cognitive Thread: Predictors ----------------------------------------

  # --- Cognitive Thread: Integrator + Segmentation + Orchestrator ----------

  somabrain_standalone_integrator_triplet:
    build:
      context: ../..
      dockerfile: infra/standalone/Dockerfile
    image: somabrain:latest
    restart: unless-stopped
    depends_on:
      somabrain_standalone_vault_init:
        condition: service_completed_successfully
      somabrain_standalone_kafka:
        condition: service_healthy
      somabrain_standalone_kafka_topics_init:
        condition: service_completed_successfully
    networks:
      - somabrain_standalone_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Django settings MUST be first - required for all Django workers
      DJANGO_SETTINGS_MODULE: "somabrain.settings.standalone"
      RUNNING_IN_DOCKER: "true"

      # VAULT BOOTSTRAP ONLY
      VAULT_ADDR: "${SOMABRAIN_VAULT_ADDR:?set SOMABRAIN_VAULT_ADDR}"
      VAULT_TOKEN_FILE: "${SOMABRAIN_VAULT_TOKEN_FILE:?set SOMABRAIN_VAULT_TOKEN_FILE}"

      # Resolved secrets required before Django settings import.
      # Use the internal Postgres service name; the host-bound port is not reachable from the container.
      SOMABRAIN_MEMORY_HTTP_ENDPOINT: "${SOMABRAIN_MEMORY_HTTP_ENDPOINT:?set SOMABRAIN_MEMORY_HTTP_ENDPOINT}"

      # Propagate the global memory cap to the integrator service.
      SOMABRAIN_MEMORY_MAX: "${SOMABRAIN_MEMORY_MAX:?set SOMABRAIN_MEMORY_MAX}"
      SOMABRAIN_KAFKA_URL: "${SOMABRAIN_KAFKA_URL:?set SOMABRAIN_KAFKA_URL}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:?set KAFKA_BOOTSTRAP_SERVERS}"
      SOMA_KAFKA_BOOTSTRAP: "${SOMA_KAFKA_BOOTSTRAP:?set SOMA_KAFKA_BOOTSTRAP}"
      SOMABRAIN_TOPIC_STATE_UPDATES: "${SOMABRAIN_TOPIC_STATE_UPDATES:?set SOMABRAIN_TOPIC_STATE_UPDATES}"
      SOMABRAIN_TOPIC_AGENT_UPDATES: "${SOMABRAIN_TOPIC_AGENT_UPDATES:?set SOMABRAIN_TOPIC_AGENT_UPDATES}"
      SOMABRAIN_TOPIC_GLOBAL_FRAME: "${SOMABRAIN_TOPIC_GLOBAL_FRAME:?set SOMABRAIN_TOPIC_GLOBAL_FRAME}"
      SOMABRAIN_TOPIC_NEXT_EVENT: "${SOMABRAIN_TOPIC_NEXT_EVENT:?set SOMABRAIN_TOPIC_NEXT_EVENT}"
      SOMABRAIN_TOPIC_CONFIG_UPDATES: "${SOMABRAIN_TOPIC_CONFIG_UPDATES:?set SOMABRAIN_TOPIC_CONFIG_UPDATES}"
      SOMABRAIN_STRICT_REAL: "1"
      SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS: "${SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS:?set SOMABRAIN_REQUIRE_EXTERNAL_BACKENDS}"
      SOMABRAIN_REQUIRE_MEMORY: "${SOMABRAIN_REQUIRE_MEMORY:?set SOMABRAIN_REQUIRE_MEMORY}"
    command: [ "python", "-m", "somabrain.services.integrator_hub_triplet" ]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 192M
    volumes:
      - ${SOMA_T0_SECRETS_DIR:?set SOMA_T0_SECRETS_DIR}:/run/secrets_t0:ro
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:9015/health" ]
      interval: 30s
      timeout: 5s
      retries: 1
    ports:
      - "${INTEGRATOR_HEALTH_HOST_PORT:?set INTEGRATOR_HEALTH_HOST_PORT}:9015"

volumes:
  kafka_data:
    driver: local
  # Vault file storage — secrets survive container restart.
  somabrain_standalone_vault_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  opa_data:
    driver: local
  prometheus_data:
    driver: local
  jaeger_data:
    driver: local
  minio_data:
    driver: local

# Shared-network option:
#   docker compose -f docker-compose.yml -f docker-compose.shared-network.yml up -d
#   (attaches all services to the external `soma-stack-net` bridge)
networks:
  somabrain_standalone_net:
    driver: bridge
